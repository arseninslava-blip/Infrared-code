; PlatformIO project for Raspberry Pi Pico 2 (RP2350)
; RoboCup omni-platform controller: motors over CAN, camera/line/gyro over I2C.

[env:rpipico2]
platform = raspberrypi
board = rpipico2
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200
upload_protocol = picotool

lib_deps =
    coryjfowler/mcp_can @ ^1.5.1

build_flags =
    -Wall