; Исходники — сам скетч Arduino в этой папке (main.ino и .h рядом), поэтому папку
; открывают и в PlatformIO (VS Code / CLion), и в Arduino IDE (файл main.ino).
; Сборка: pio run, прошивка: pio run -t upload, монитор порта: pio device monitor.

[platformio]
src_dir = .

[env:main]
; Платформа с RP2350 и ядром arduino-pico. Если на другом компьютере платы MyRP_2350B нет,
; поставьте platform = https://github.com/maxgerhardt/platform-raspberrypi.git
platform = raspberrypi
board = MyRP_2350B
framework = arduino
board_build.core = earlephilhower

; Компилировать только скетч: не сборку PlatformIO и не архив старого кода.
; *.cpp — временный main.ino.cpp, в который PlatformIO превращает main.ino на время сборки
build_src_filter = +<*.ino> +<*.cpp> -<.pio/> -<archive/>
build_flags = -Wall

; Библиотеки берутся из той же папки, что и в Arduino IDE (mcp_can),
; поэтому обе среды собирают с одинаковыми версиями
lib_extra_dirs = ${sysenv.USERPROFILE}/Documents/Arduino/libraries
lib_ldf_mode = chain

monitor_speed = 115200
