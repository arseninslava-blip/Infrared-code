; PlatformIO project for Raspberry Pi Pico (RP2040)
; Line sensor: 4 phototransistors read directly on A0-A3,
; NeoPixel strip that lights the floor, I2C slave interface (replaces the old CAN bus).

[env:pico]
platform = raspberrypi
board = pico
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200
upload_protocol = picotool
; If you flash by dragging the .uf2 onto the RPI-RP2 mass-storage drive instead,
; you can ignore upload_protocol/upload_port and just copy .pio/build/pico/firmware.uf2.

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

build_flags =
    -Wall
